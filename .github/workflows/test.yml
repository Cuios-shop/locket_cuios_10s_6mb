name: Test module
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run test:protected
      - run: python3 -m unittest discover -s test -p test_security_audit.py
      - run: python3 tools/audit_repository.py
